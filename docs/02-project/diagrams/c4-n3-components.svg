  <line x1="30" y1="308" x2="650" y2="308" stroke="#D3D1C7" stroke-width="1"/>
  <text x="40" y="326" font-size="11" font-weight="600" fill="#5F5E5A">Camada de infraestrutura</text>

  <rect x="40" y="334" width="138" height="60" rx="6" fill="#E1F5EE" stroke="#5DCAA5"/>
  <text x="109" y="356" text-anchor="middle" font-size="12" font-weight="600" fill="#085041">StellarService</text>
  <text x="109" y="372" text-anchor="middle" font-size="10.5" fill="#0F6E56">Treasury · fee-bump</text>
  <text x="109" y="386" text-anchor="middle" font-size="10.5" fill="#0F6E56">Horizon · KMS</text>

  <rect x="196" y="334" width="148" height="60" rx="6" fill="#E1F5EE" stroke="#5DCAA5"/>
  <text x="270" y="356" text-anchor="middle" font-size="12" font-weight="600" fill="#085041">SorobanService</text>
  <text x="270" y="372" text-anchor="middle" font-size="10.5" fill="#0F6E56">XDR · TicketContract</text>
  <text x="270" y="386" text-anchor="middle" font-size="10.5" fill="#0F6E56">EscrowContract</text>

  <rect x="362" y="334" width="148" height="60" rx="6" fill="#E1F5EE" stroke="#5DCAA5"/>
  <text x="436" y="356" text-anchor="middle" font-size="12" font-weight="600" fill="#085041">BlindPayService</text>
  <text x="436" y="372" text-anchor="middle" font-size="10.5" fill="#0F6E56">quotes · payin</text>
  <text x="436" y="386" text-anchor="middle" font-size="10.5" fill="#0F6E56">payout · receivers</text>

  <rect x="528" y="334" width="112" height="60" rx="6" fill="#E1F5EE" stroke="#5DCAA5"/>
  <text x="584" y="356" text-anchor="middle" font-size="12" font-weight="600" fill="#085041">PrivyAuthService</text>
  <text x="584" y="372" text-anchor="middle" font-size="10.5" fill="#0F6E56">verifyToken</text>
  <text x="584" y="386" text-anchor="middle" font-size="10.5" fill="#0F6E56">createWallet</text>

  <rect x="40" y="414" width="600" height="48" rx="6" fill="#E1F5EE" stroke="#5DCAA5"/>
  <text x="340" y="434" text-anchor="middle" font-size="12" font-weight="600" fill="#085041">OutboxService + OutboxRelay</text>
  <text x="340" y="450" text-anchor="middle" font-size="10.5" fill="#0F6E56">Escreve domain_events na mesma tx · polling 500ms · publica no BullMQ</text>

  <!-- Setas verticais entre camadas -->
  <line x1="109" y1="116" x2="109" y2="158" stroke="#B4B2A9" stroke-width="1" marker-end="url(#arrow3)"/>
  <line x1="270" y1="116" x2="270" y2="158" stroke="#B4B2A9" stroke-width="1" marker-end="url(#arrow3)"/>
  <line x1="436" y1="116" x2="436" y2="158" stroke="#B4B2A9" stroke-width="1" marker-end="url(#arrow3)"/>
  <line x1="584" y1="116" x2="584" y2="158" stroke="#B4B2A9" stroke-width="1" marker-end="url(#arrow3)"/>

  <line x1="109" y1="226" x2="109" y2="332" stroke="#B4B2A9" stroke-width="1" marker-end="url(#arrow3)"/>
  <line x1="270" y1="226" x2="270" y2="332" stroke="#B4B2A9" stroke-width="1" marker-end="url(#arrow3)"/>
  <line x1="436" y1="226" x2="436" y2="332" stroke="#B4B2A9" stroke-width="1" marker-end="url(#arrow3)"/>
  <line x1="584" y1="226" x2="584" y2="332" stroke="#B4B2A9" stroke-width="1" marker-end="url(#arrow3)"/>

  <!-- Legenda -->
  <rect x="40" y="482" width="10" height="10" rx="2" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="56" y="491" font-size="10.5" fill="#444441">Entrada / suporte</text>
  <rect x="200" y="482" width="10" height="10" rx="2" fill="#EEEDFE" stroke="#7F77DD"/>
  <text x="216" y="491" font-size="10.5" fill="#444441">Domínio (CQRS)</text>
  <rect x="360" y="482" width="10" height="10" rx="2" fill="#E1F5EE" stroke="#5DCAA5"/>
  <text x="376" y="491" font-size="10.5" fill="#444441">Infraestrutura</text>

  <text x="340" y="520" text-anchor="middle" font-size="10.5" fill="#73726c">Todos os módulos de domínio publicam eventos via OutboxService na mesma transação Postgres.</text>
  <text x="340" y="538" text-anchor="middle" font-size="10.5" fill="#73726c">Nenhuma escrita acontece sem o evento correspondente — garantia de consistência.</text>
</svg>
