  <rect x="40" y="160" width="138" height="66" rx="6" fill="#EEEDFE" stroke="#7F77DD"/>
  <text x="109" y="180" text-anchor="middle" font-size="12" font-weight="600" fill="#3C3489">TicketsModule</text>
  <text x="109" y="196" text-anchor="middle" font-size="10.5" fill="#534AB7">Write: Postgres·Soroban</text>
  <text x="109" y="210" text-anchor="middle" font-size="10.5" fill="#534AB7">Read: Redis cache</text>

  <rect x="196" y="160" width="148" height="66" rx="6" fill="#EEEDFE" stroke="#7F77DD"/>
  <text x="270" y="180" text-anchor="middle" font-size="12" font-weight="600" fill="#3C3489">FinanceModule</text>
  <text x="270" y="196" text-anchor="middle" font-size="10.5" fill="#534AB7">ledger append-only</text>
  <text x="270" y="210" text-anchor="middle" font-size="10.5" fill="#534AB7">split · saldo</text>

  <rect x="362" y="160" width="148" height="66" rx="6" fill="#EEEDFE" stroke="#7F77DD"/>
  <text x="436" y="180" text-anchor="middle" font-size="12" font-weight="600" fill="#3C3489">WithdrawalsModule</text>
  <text x="436" y="196" text-anchor="middle" font-size="10.5" fill="#534AB7">lock Redis · payout</text>
  <text x="436" y="210" text-anchor="middle" font-size="10.5" fill="#534AB7">recovery</text>

  <rect x="528" y="160" width="112" height="66" rx="6" fill="#EEEDFE" stroke="#7F77DD"/>
  <text x="584" y="180" text-anchor="middle" font-size="12" font-weight="600" fill="#3C3489">CheckinModule</text>
  <text x="584" y="196" text-anchor="middle" font-size="10.5" fill="#534AB7">QR Code · sync</text>
  <text x="584" y="210" text-anchor="middle" font-size="10.5" fill="#534AB7">snapshot HMAC</text>

  <rect x="40" y="242" width="138" height="46" rx="6" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="109" y="270" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2C2C2A">EventsModule</text>

  <rect x="196" y="242" width="148" height="46" rx="6" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="270" y="270" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2C2C2A">OrganizationsModule</text>

  <rect x="362" y="242" width="148" height="46" rx="6" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="436" y="270" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2C2C2A">NotificationsModule</text>

