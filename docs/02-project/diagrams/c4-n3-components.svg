  </defs>

  <text x="340" y="20" text-anchor="middle" font-size="12" fill="#8A8880">N3 · Componentes internos — API NestJS</text>

  <!-- Camada 1: Entrada -->
  <line x1="30" y1="36" x2="650" y2="36" stroke="#D3D1C7" stroke-width="1"/>
  <text x="40" y="54" font-size="11" font-weight="600" fill="#5F5E5A">Camada de entrada</text>

  <rect x="40" y="62" width="138" height="54" rx="6" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="109" y="84" text-anchor="middle" font-size="12" font-weight="600" fill="#2C2C2A">AuthModule</text>
  <text x="109" y="100" text-anchor="middle" font-size="10.5" fill="#444441">Privy JWT · guard</text>

  <rect x="196" y="62" width="148" height="54" rx="6" fill="#F1EFE8" stroke="#B4B2A9"/>
