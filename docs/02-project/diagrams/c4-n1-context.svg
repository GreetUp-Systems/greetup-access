<svg width="680" height="540" viewBox="0 0 680 540" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
  <rect width="680" height="540" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#55534D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="340" y="22" text-anchor="middle" font-size="12" fill="#8A8880">N1 · Diagrama de contexto — GreetUp Access</text>

  <!-- Usuarios -->
  <rect x="30" y="34" width="150" height="60" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="1"/>
  <text x="105" y="60" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">Comprador</text>
  <text x="105" y="78" text-anchor="middle" font-size="11" fill="#0F6E56">Paga Pix, recebe ingresso</text>

  <rect x="265" y="34" width="150" height="60" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="1"/>
  <text x="340" y="60" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">Produtor</text>
  <text x="340" y="78" text-anchor="middle" font-size="11" fill="#0F6E56">Cria eventos, saca valores</text>

  <rect x="490" y="34" width="150" height="60" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="1"/>
  <text x="565" y="60" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">Staff</text>
  <text x="565" y="78" text-anchor="middle" font-size="11" fill="#0F6E56">Credencia participantes</text>

  <!-- Sistema central -->
  <rect x="220" y="190" width="240" height="90" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
  <text x="340" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#3C3489">GreetUp Access</text>
  <text x="340" y="242" text-anchor="middle" font-size="11" fill="#534AB7">Ingressos, credenciamento</text>
  <text x="340" y="258" text-anchor="middle" font-size="11" fill="#534AB7">e repasse financeiro B2B</text>

  <!-- Externos -->
  <rect x="20" y="380" width="150" height="68" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1"/>
  <text x="95" y="405" text-anchor="middle" font-size="13" font-weight="600" fill="#633806">BlindPay</text>
  <text x="95" y="422" text-anchor="middle" font-size="11" fill="#854F0B">Pix &#8596; USDC</text>
  <text x="95" y="437" text-anchor="middle" font-size="11" fill="#854F0B">KYB · payout</text>

  <rect x="190" y="380" width="150" height="68" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1"/>
  <text x="265" y="405" text-anchor="middle" font-size="13" font-weight="600" fill="#633806">Privy</text>
  <text x="265" y="422" text-anchor="middle" font-size="11" fill="#854F0B">Wallet abstraction</text>
  <text x="265" y="437" text-anchor="middle" font-size="11" fill="#854F0B">login · signing</text>

  <rect x="360" y="380" width="150" height="68" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1"/>
  <text x="435" y="405" text-anchor="middle" font-size="13" font-weight="600" fill="#633806">Stellar</text>
  <text x="435" y="422" text-anchor="middle" font-size="11" fill="#854F0B">Soroban contracts</text>
  <text x="435" y="437" text-anchor="middle" font-size="11" fill="#854F0B">Ticket · Escrow</text>

  <rect x="530" y="380" width="110" height="68" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
  <text x="585" y="405" text-anchor="middle" font-size="13" font-weight="600" fill="#2C2C2A">Email</text>
  <text x="585" y="422" text-anchor="middle" font-size="11" fill="#444441">Resend</text>
  <text x="585" y="437" text-anchor="middle" font-size="11" fill="#444441">notificações</text>

  <!-- Conexoes usuarios -> centro -->
  <path d="M105,94 L105,235 L218,235" fill="none" stroke="#55534D" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="150" y="228" text-anchor="middle" font-size="10.5" fill="#73726c">compra</text>

  <path d="M340,94 L340,188" fill="none" stroke="#55534D" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="368" y="150" text-anchor="start" font-size="10.5" fill="#73726c">gerencia</text>

  <path d="M565,94 L565,235 L462,235" fill="none" stroke="#55534D" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="530" y="228" text-anchor="middle" font-size="10.5" fill="#73726c">credencia</text>

  <!-- Barramento distribuidor centro -> externos -->
  <line x1="340" y1="280" x2="340" y2="330" stroke="#55534D" stroke-width="1.2"/>
  <line x1="95" y1="330" x2="585" y2="330" stroke="#55534D" stroke-width="1.2"/>
  <line x1="95" y1="330" x2="95" y2="378" stroke="#55534D" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="265" y1="330" x2="265" y2="378" stroke="#55534D" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="435" y1="330" x2="435" y2="378" stroke="#55534D" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="585" y1="330" x2="585" y2="378" stroke="#55534D" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="480" y="322" text-anchor="middle" font-size="10.5" fill="#73726c">requisições e webhooks</text>

  <!-- Legenda -->
  <rect x="30" y="490" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#5DCAA5"/>
  <text x="50" y="501" font-size="11" fill="#444441">Usuário humano</text>
  <rect x="180" y="490" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#7F77DD"/>
  <text x="200" y="501" font-size="11" fill="#444441">Sistema GreetUp</text>
  <rect x="330" y="490" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#EF9F27"/>
  <text x="350" y="501" font-size="11" fill="#444441">Sistema externo</text>
  <rect x="480" y="490" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="500" y="501" font-size="11" fill="#444441">Serviço de suporte</text>
</svg>
