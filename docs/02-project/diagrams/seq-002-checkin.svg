<svg width="680" height="700" viewBox="0 0 680 700" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
  <rect width="680" height="700" fill="#FFFFFF"/>
  <defs>
    <marker id="b1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#55534D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="b1r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#B4B2A9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="b1g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="b1amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="b1red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#A32D2D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="340" y="18" text-anchor="middle" font-size="12" fill="#8A8880">SEQ-002 · Credenciamento offline e sincronização</text>

  <rect x="28" y="30" width="84" height="38" rx="5" fill="#E1F5EE" stroke="#5DCAA5"/>
  <text x="70" y="53" text-anchor="middle" font-size="11" font-weight="600" fill="#085041">Staff</text>

  <rect x="148" y="30" width="84" height="38" rx="5" fill="#EEEDFE" stroke="#7F77DD"/>
  <text x="190" y="46" text-anchor="middle" font-size="10.5" font-weight="600" fill="#3C3489">PWA</text>
  <text x="190" y="60" text-anchor="middle" font-size="9.5" fill="#534AB7">IndexedDB</text>

  <rect x="268" y="30" width="84" height="38" rx="5" fill="#EEEDFE" stroke="#7F77DD"/>
  <text x="310" y="46" text-anchor="middle" font-size="10.5" font-weight="600" fill="#3C3489">Service</text>
  <text x="310" y="60" text-anchor="middle" font-size="9.5" fill="#534AB7">Worker</text>

  <rect x="388" y="30" width="84" height="38" rx="5" fill="#EEEDFE" stroke="#7F77DD"/>
  <text x="430" y="53" text-anchor="middle" font-size="11" font-weight="600" fill="#3C3489">API</text>

  <rect x="508" y="30" width="84" height="38" rx="5" fill="#FAEEDA" stroke="#EF9F27"/>
  <text x="550" y="53" text-anchor="middle" font-size="11" font-weight="600" fill="#633806">Soroban</text>

  <rect x="602" y="30" width="66" height="38" rx="5" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="635" y="46" text-anchor="middle" font-size="10" font-weight="600" fill="#2C2C2A">Dash</text>
  <text x="635" y="60" text-anchor="middle" font-size="9.5" fill="#444441">produtor</text>

  <g stroke="#D3D1C7" stroke-width="1" stroke-dasharray="3 4">
    <line x1="70" y1="68" x2="70" y2="670"/>
    <line x1="190" y1="68" x2="190" y2="670"/>
    <line x1="310" y1="68" x2="310" y2="670"/>
    <line x1="430" y1="68" x2="430" y2="670"/>
    <line x1="550" y1="68" x2="550" y2="670"/>
    <line x1="635" y1="68" x2="635" y2="670"/>
  </g>

  <!-- Fase 1 -->
  <rect x="28" y="82" width="640" height="18" rx="3" fill="#EEEDFE"/>
  <text x="340" y="95" text-anchor="middle" font-size="10.5" font-weight="600" fill="#3C3489">Fase 1 — Pré-evento · com internet</text>

  <line x1="70" y1="118" x2="188" y2="118" stroke="#55534D" stroke-width="1.1" marker-end="url(#b1)"/>
  <text x="128" y="113" text-anchor="middle" font-size="9.5">abre PWA, seleciona evento</text>

  <line x1="190" y1="136" x2="428" y2="136" stroke="#55534D" stroke-width="1.1" marker-end="url(#b1)"/>
  <text x="308" y="131" text-anchor="middle" font-size="9.5">GET /events/:id/ticket-snapshot</text>

  <path d="M430,150 Q450,150 450,160 Q450,170 430,170" fill="none" stroke="#55534D" stroke-width="0.9"/>
  <text x="456" y="163" text-anchor="start" font-size="9.5" fill="#73726c">gera snapshot + HMAC</text>

  <line x1="430" y1="184" x2="192" y2="184" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#b1r)"/>
  <text x="308" y="179" text-anchor="middle" font-size="9.5" fill="#73726c">tickets[], hmac_key</text>

  <path d="M190,198 Q210,198 210,208 Q210,218 190,218" fill="none" stroke="#55534D" stroke-width="0.9"/>
  <text x="216" y="211" text-anchor="start" font-size="9.5" fill="#73726c">salva no IndexedDB</text>

  <line x1="190" y1="232" x2="72" y2="232" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#b1r)"/>
  <text x="128" y="227" text-anchor="middle" font-size="9.5" fill="#73726c">✓ 412 tickets carregados</text>

  <!-- Fase 2 -->
  <rect x="28" y="248" width="640" height="18" rx="3" fill="#FAEEDA"/>
  <text x="340" y="261" text-anchor="middle" font-size="10.5" font-weight="600" fill="#854F0B">Fase 2 — Durante o evento · offline</text>

  <line x1="70" y1="284" x2="188" y2="284" stroke="#55534D" stroke-width="1.1" marker-end="url(#b1)"/>
  <text x="128" y="279" text-anchor="middle" font-size="9.5">escaneia QR Code</text>

  <path d="M190,298 Q210,298 210,308 Q210,318 190,318" fill="none" stroke="#55534D" stroke-width="0.9"/>
  <text x="216" y="311" text-anchor="start" font-size="9.5" fill="#73726c">valida HMAC local</text>
  <path d="M190,326 Q210,326 210,336 Q210,346 190,346" fill="none" stroke="#55534D" stroke-width="0.9"/>
  <text x="216" y="339" text-anchor="start" font-size="9.5" fill="#73726c">busca ticket local</text>

  <!-- 3 resultados -->
  <rect x="28" y="358" width="200" height="15" rx="3" fill="#E1F5EE"/>
  <text x="128" y="369" text-anchor="middle" font-size="9.5" fill="#0F6E56">se válido</text>
  <line x1="190" y1="384" x2="72" y2="384" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#b1g)"/>
  <text x="128" y="379" text-anchor="middle" font-size="9.5">VERDE · VÁLIDO</text>

  <rect x="238" y="358" width="200" height="15" rx="3" fill="#FAEEDA"/>
  <text x="338" y="369" text-anchor="middle" font-size="9.5" fill="#854F0B">se já utilizado</text>
  <line x1="340" y1="398" x2="72" y2="398" stroke="#BA7517" stroke-width="1.5" marker-end="url(#b1amber)"/>
  <text x="230" y="393" text-anchor="middle" font-size="9.5">ÂMBAR · JÁ UTILIZADO</text>

  <rect x="448" y="358" width="200" height="15" rx="3" fill="#FAECE7"/>
  <text x="548" y="369" text-anchor="middle" font-size="9.5" fill="#712B13">se inválido</text>
  <line x1="550" y1="412" x2="72" y2="412" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#b1red)"/>
  <text x="360" y="407" text-anchor="middle" font-size="9.5">VERMELHO · INVÁLIDO</text>

  <path d="M190,422 Q210,422 210,432 Q210,442 190,442" fill="none" stroke="#55534D" stroke-width="0.9"/>
  <text x="216" y="435" text-anchor="start" font-size="9.5" fill="#73726c">marca checked_in local · fila sync</text>

  <!-- Fase 3 -->
  <rect x="28" y="456" width="640" height="18" rx="3" fill="#E1F5EE"/>
  <text x="340" y="469" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0F6E56">Fase 3 — Internet disponível · Background Sync</text>

  <line x1="310" y1="490" x2="428" y2="490" stroke="#55534D" stroke-width="1.1" marker-end="url(#b1)"/>
  <text x="368" y="485" text-anchor="middle" font-size="9.5">POST /checkins/sync (batch)</text>

  <path d="M430,504 Q450,504 450,514 Q450,524 430,524" fill="none" stroke="#55534D" stroke-width="0.9"/>
  <text x="456" y="517" text-anchor="start" font-size="9.5" fill="#73726c">INSERT CheckinEvents batch</text>

  <line x1="430" y1="538" x2="548" y2="538" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#b1g)"/>
  <text x="488" y="533" text-anchor="middle" font-size="9.5" fill="#0F6E56">check_in() batch</text>

  <path d="M550,552 Q570,552 570,562 Q570,572 550,572" fill="none" stroke="#55534D" stroke-width="0.9"/>
  <text x="576" y="565" text-anchor="start" font-size="9.5" fill="#73726c">rejeita duplicatas</text>

  <line x1="550" y1="586" x2="432" y2="586" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#b1r)"/>
  <text x="490" y="581" text-anchor="middle" font-size="9.5" fill="#73726c">synced: N</text>

  <line x1="430" y1="602" x2="633" y2="602" stroke="#55534D" stroke-width="1.1" marker-end="url(#b1)"/>
  <text x="530" y="597" text-anchor="middle" font-size="9.5">WS: presença atualizada</text>

  <line x1="310" y1="618" x2="192" y2="618" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#b1r)"/>
  <text x="248" y="613" text-anchor="middle" font-size="9.5" fill="#73726c">synced, conflicts</text>

  <line x1="190" y1="634" x2="72" y2="634" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#b1r)"/>
  <text x="128" y="629" text-anchor="middle" font-size="9.5" fill="#73726c">fila local limpa</text>

  <!-- legenda -->
  <line x1="40" y1="662" x2="60" y2="662" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="66" y="666" font-size="10" fill="#444441">Válido</text>
  <line x1="130" y1="662" x2="150" y2="662" stroke="#BA7517" stroke-width="1.5"/>
  <text x="156" y="666" font-size="10" fill="#444441">Já utilizado</text>
  <line x1="250" y1="662" x2="270" y2="662" stroke="#A32D2D" stroke-width="1.5"/>
  <text x="276" y="666" font-size="10" fill="#444441">Inválido</text>
  <text x="500" y="666" text-anchor="middle" font-size="10" fill="#73726c">Validação 100% local, sem internet</text>
</svg>
