version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: greetup_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: greetup
      POSTGRES_PASSWORD: greetup
      POSTGRES_DB: greetup_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U greetup -d greetup_dev']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: greetup_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # Opcional: Redis Commander para visualizar filas em dev
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: greetup_redis_commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - '8081:8081'
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - tools

  # Opcional: pgAdmin para inspecionar o banco em dev
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: greetup_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@greetup.com
      PGADMIN_DEFAULT_PASSWORD: greetup
    ports:
      - '5050:80'
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

volumes:
  postgres_data:
  redis_data:
