[workspace]
resolver = "2"
members = ["contracts/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false

# Exact pins (SPEC-006 §4): OpenZeppelin 0.7.2 is built against soroban-sdk 26.1.0.
[workspace.dependencies]
soroban-sdk = "=26.1.0"
stellar-access = "=0.7.2"
stellar-macros = "=0.7.2"
stellar-tokens = "=0.7.2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
