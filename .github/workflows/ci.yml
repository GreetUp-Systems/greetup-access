name: CI

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  # ─── Stage 1: Secret Scan ──────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # inclui base e head para limitar a varredura ao intervalo do evento

      - name: Run Gitleaks on pull request commits
        if: github.event_name == 'pull_request'
        run: >-
          docker run --rm
          --volume "$PWD:/repo"
          --workdir /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git --redact --verbose
          --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          /repo

      - name: Run Gitleaks on pushed commits
        if: github.event_name == 'push'
        run: >-
          docker run --rm
          --volume "$PWD:/repo"
          --workdir /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git --redact --verbose
          --log-opts="${{ github.event.before }}..${{ github.sha }}"
          /repo

  # ─── Stage 2: Validate ─────────────────────────────────────────────────────
  validate:
    name: Validate (typecheck + lint + format)
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/turbo.json') }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ hashFiles('**/turbo.json') }}-

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm turbo lint

      - name: Format check
        run: pnpm turbo format -- --check

  # ─── Stage 3: Test ─────────────────────────────────────────────────────────
  test:
    name: Tests (unit + integration)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/turbo.json') }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Unit tests
        run: pnpm turbo test
        env:
          NODE_ENV: test

      - name: Start test services (Postgres + Redis)
        run: |
          docker compose -f docker-compose.test.yml up -d
          # Aguarda health checks
          docker compose -f docker-compose.test.yml ps

      - name: Wait for services
        run: |
          until docker exec access_postgres_test pg_isready -U test; do sleep 1; done
          until docker exec access_redis_test redis-cli ping; do echo "waiting redis..."; sleep 1; done

      - name: Run database migrations (test)
        run: pnpm turbo db:migrate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5433/access_test
          DATABASE_URL_DIRECT: postgresql://test:test@localhost:5433/access_test

      - name: Integration tests
        # Suites share one database and Redis; run them one package at a time.
        run: pnpm turbo test:integration --concurrency=1
        env:
          DATABASE_URL: postgresql://access_runtime:test_runtime@localhost:5433/access_test
          DATABASE_URL_DIRECT: postgresql://test:test@localhost:5433/access_test
          REDIS_URL: redis://localhost:6380
          NODE_ENV: test

      - name: Stop test services
        if: always()
        run: docker compose -f docker-compose.test.yml down

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: "**/coverage/**"
          retention-days: 7

  # ─── Stage 3b: End-to-end (web) ───────────────────────────────────────────
  e2e:
    name: End-to-end (web, Chromium)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @access/web exec playwright install --with-deps chromium

      # The API is simulated (apps/web/e2e/mock-api.mjs); no database or secret is needed.
      - name: End-to-end tests
        run: pnpm --filter @access/web test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7

  # ─── Stage 4: Security (SAST + dependency scan) ────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: validate
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Run Snyk (dependency vulnerabilities)
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ env.SNYK_TOKEN }}
        with:
          args: --all-projects --severity-threshold=high

      - name: Report missing Snyk configuration
        if: env.SNYK_TOKEN == ''
        run: echo "::warning::SNYK_TOKEN is not configured; dependency scanning was skipped."

  # ─── Stage 5: Build (Docker images) ───────────────────────────────────────
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write # para push no GHCR

    strategy:
      matrix:
        app: [api, workers, web]

    steps:
      - uses: actions/checkout@v4

      - name: Detect Dockerfile
        id: docker-source
        shell: bash
        run: |
          if [ -f "apps/${{ matrix.app }}/Dockerfile" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker build skipped because apps/${{ matrix.app }}/Dockerfile does not exist."
          fi

      - name: Set up Docker Buildx
        if: steps.docker-source.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.docker-source.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: steps.docker-source.outputs.enabled == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/greetup-systems/greetup-access-${{ matrix.app }}
          tags: |
            type=sha,prefix={{branch}}-
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push
        if: steps.docker-source.outputs.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP=${{ matrix.app }}
            BUILD_SHA=${{ github.sha }}

  # ─── Stage 6: Contracts (Soroban) ─────────────────────────────────────────
  # Built and deployed with Caatinga (D-25); CI only builds and tests (SPEC-006 §10).
  contracts:
    name: Soroban Contracts (build + test)
    runs-on: ubuntu-latest
    needs: secret-scan
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/contracts

      - name: Install stellar-cli
        uses: stellar/stellar-cli@v28.1.0

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run contract tests
        run: cargo test --locked

      - name: Build WASM (release)
        run: stellar contract build --locked

      - name: Check WASM size (max 64KB per contract)
        run: |
          for wasm in target/wasm32v1-none/release/*.wasm; do
            size=$(wc -c < "$wasm")
            name=$(basename "$wasm")
            echo "$name: ${size} bytes"
            if [ "$size" -gt 65536 ]; then
              echo "ERROR: $name exceeds 64KB limit ($size bytes)"
              exit 1
            fi
          done

      - name: Compute WASM checksums
        run: sha256sum target/wasm32v1-none/release/*.wasm

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contracts-wasm-${{ github.sha }}
          path: packages/contracts/target/wasm32v1-none/release/*.wasm
          retention-days: 30
