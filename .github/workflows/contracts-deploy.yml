name: Contracts Deploy

on:
  push:
    branches:
      - 'contracts/**'  # ex: contracts/ticket-v2, contracts/escrow-v1

jobs:
  deploy-testnet:
    name: Deploy → Testnet
    runs-on: ubuntu-latest
    environment: testnet-contracts
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + stellar-cli
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - run: cargo install stellar-cli --features opt

      - name: Build WASM
        run: stellar contract build --manifest-path packages/contracts/Cargo.toml --release

      - name: Compute SHA256
        run: sha256sum packages/contracts/target/wasm32-unknown-unknown/release/*.wasm

      - name: Deploy TicketContract → Testnet
        id: deploy-ticket
        run: |
          ADDRESS=$(stellar contract deploy \
            --wasm packages/contracts/target/wasm32-unknown-unknown/release/ticket_contract.wasm \
            --source ${{ secrets.DEPLOY_KEYPAIR_TESTNET }} \
            --network testnet)
          echo "ticket_address=$ADDRESS" >> $GITHUB_OUTPUT
          echo "TicketContract deployed at: $ADDRESS"

      - name: Deploy EscrowContract → Testnet
        id: deploy-escrow
        run: |
          ADDRESS=$(stellar contract deploy \
            --wasm packages/contracts/target/wasm32-unknown-unknown/release/escrow_contract.wasm \
            --source ${{ secrets.DEPLOY_KEYPAIR_TESTNET }} \
            --network testnet)
          echo "escrow_address=$ADDRESS" >> $GITHUB_OUTPUT
          echo "EscrowContract deployed at: $ADDRESS"

      - name: Run integration tests against testnet
        run: pnpm turbo test:integration
        env:
          SOROBAN_TICKET_CONTRACT_ADDRESS: ${{ steps.deploy-ticket.outputs.ticket_address }}
          SOROBAN_ESCROW_CONTRACT_ADDRESS: ${{ steps.deploy-escrow.outputs.escrow_address }}
          STELLAR_NETWORK: testnet

      - name: Summary
        run: |
          echo "## Testnet Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "- TicketContract: ${{ steps.deploy-ticket.outputs.ticket_address }}" >> $GITHUB_STEP_SUMMARY
          echo "- EscrowContract: ${{ steps.deploy-escrow.outputs.escrow_address }}" >> $GITHUB_STEP_SUMMARY

  # ─── Mainnet requer aprovação manual obrigatória ──────────────────────────
  deploy-mainnet:
    name: Deploy → Mainnet (REQUIRES APPROVAL)
    runs-on: ubuntu-latest
    needs: deploy-testnet
    environment: mainnet-contracts  # 2 required reviewers configurados
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + stellar-cli
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - run: cargo install stellar-cli --features opt

      - name: Build WASM (deterministic)
        run: stellar contract build --manifest-path packages/contracts/Cargo.toml --release

      - name: Final SHA256 verification
        run: sha256sum packages/contracts/target/wasm32-unknown-unknown/release/*.wasm

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy TicketContract → Mainnet
        id: deploy-ticket-mainnet
        run: |
          # Chave de deploy armazenada no KMS — nunca em secret do GitHub
          ADDRESS=$(stellar contract deploy \
            --wasm packages/contracts/target/wasm32-unknown-unknown/release/ticket_contract.wasm \
            --source ${{ secrets.DEPLOY_KEYPAIR_MAINNET }} \
            --network mainnet)
          echo "ticket_address=$ADDRESS" >> $GITHUB_OUTPUT

      - name: Deploy EscrowContract → Mainnet
        id: deploy-escrow-mainnet
        run: |
          ADDRESS=$(stellar contract deploy \
            --wasm packages/contracts/target/wasm32-unknown-unknown/release/escrow_contract.wasm \
            --source ${{ secrets.DEPLOY_KEYPAIR_MAINNET }} \
            --network mainnet)
          echo "escrow_address=$ADDRESS" >> $GITHUB_OUTPUT

      - name: Store contract addresses in AWS Secrets Manager
        run: |
          aws secretsmanager put-secret-value \
            --secret-id greetup/mainnet/ticket-contract-address \
            --secret-string "${{ steps.deploy-ticket-mainnet.outputs.ticket_address }}"

          aws secretsmanager put-secret-value \
            --secret-id greetup/mainnet/escrow-contract-address \
            --secret-string "${{ steps.deploy-escrow-mainnet.outputs.escrow_address }}"

      - name: Summary
        run: |
          echo "## ✅ Mainnet Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "- TicketContract: ${{ steps.deploy-ticket-mainnet.outputs.ticket_address }}" >> $GITHUB_STEP_SUMMARY
          echo "- EscrowContract: ${{ steps.deploy-escrow-mainnet.outputs.escrow_address }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Update SOROBAN_*_CONTRACT_ADDRESS in Doppler/Railway for all services.**" >> $GITHUB_STEP_SUMMARY
